<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">Travel Agency</a>
    </div>
</nav>

<div class="auth-shell">
  <div class="auth-container auth-card">
    <h2 class="text-center mb-2">Reset password</h2>
    <p class="text-center text-muted mb-4">
        Choose a strong new password to secure your account.
    </p>

    <form th:action="@{/auth/reset-password}"
          th:object="${dto}"
          method="post">
        <input type="hidden"
               th:if="${_csrf != null}"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>

        <input type="hidden" th:field="*{token}"/>

        <div class="mb-3">
            <label for="newPassword" class="form-label">New password</label>
            <input type="password" id="newPassword" class="form-control"
                   th:field="*{newPassword}" required
                   th:title="#{password.hint}"/>
            <div class="form-text" th:text="#{password.hint}">
                At least 8 chars, with upper, lower, number, and special.
            </div>
            <div class="text-danger small mt-1"
                 th:if="${#fields.hasErrors('newPassword')}"
                 th:errors="*{newPassword}"></div>
        </div>

        <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm password</label>
            <input type="password" id="confirmPassword" class="form-control"
                   th:field="*{confirmPassword}" required/>
            <div class="text-danger small mt-1"
                 th:if="${#fields.hasErrors('confirmPassword')}"
                 th:errors="*{confirmPassword}"></div>
        </div>

        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>

        <button type="submit" class="btn-submit w-100">Change password</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
