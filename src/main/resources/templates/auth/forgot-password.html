<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">Travel Agency</a>
    </div>
</nav>

<div class="auth-shell">
  <div class="auth-container auth-card">
    <h2 class="text-center mb-2">Forgot your password?</h2>
    <p class="text-center text-muted mb-4">
        Enter your email and we will send a secure reset link.
    </p>

    <div class="alert alert-success" th:if="${message}" th:text="${message}">
        Reset link sent.
    </div>

    <div class="alert alert-info" th:if="${resetLink}">
        <div class="fw-semibold">Demo reset link</div>
        <a th:href="${resetLink}" th:text="${resetLink}"></a>
    </div>

    <form th:action="@{/auth/forgot-password}"
          th:object="${request}"
          method="post">
        <input type="hidden"
               th:if="${_csrf != null}"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>

        <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" id="email" class="form-control"
                   th:field="*{email}"
                   placeholder="name@example.com" required/>
            <div class="text-danger small mt-1"
                 th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}"></div>
        </div>

        <button type="submit" class="btn-submit">Send reset link</button>
    </form>

    <div class="mt-3 text-center">
        <a class="btn btn-link" th:href="@{/auth/sign-in}">Back to sign in</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
