# -------------------------
# Server Configuration
# -------------------------
server.port=9999
server.forward-headers-strategy=framework
server.servlet.session.timeout=30m

# -------------------------
# H2 In-Memory Database
# -------------------------
spring.datasource.url=jdbc:h2:file:./data/travel_agency;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------
# JPA & Hibernate
# -------------------------
spring.jpa.hibernate.ddl-auto=update

# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.open-in-view=true

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=false

spring.jpa.properties.hibernate.hbm2ddl.import_files=
spring.sql.init.mode=never
app.db.seed=true
app.translate.google.api-key=${GOOGLE_TRANSLATE_API_KEY:}
app.translate.google.enabled=true
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

# -------------------------
# Logging Configuration
# -------------------------
# Hibernate SQL-логгери вимкнені
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# Ваш пакет – DEBUG, конфіг Spring – INFO
logging.level.com.epam.finaltask=DEBUG
logging.level.com.epam.finaltask.config=INFO
logging.level.org.springframework.config=DEBUG
logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.mail.javamail=DEBUG
logging.level.com.sun.mail=DEBUG

# -------------------------
# Open-in-View Warning
# -------------------------

# -------------------------
# Localization & Messaging
# -------------------------
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.messages.always-use-message-format=true

spring.web.locale=en
spring.web.locale-resolver=fixed

# -------------------------
# Static Resources Cache
# -------------------------
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.no-cache=true

# -------------------------
# Thymeleaf
# -------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# -------------------------
# JWT Configuration
# -------------------------
application.security.jwt.secret-key=404E635263336A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=172800000

# -------------------------
# OAuth2 Login Toggle
# -------------------------
app.oauth2.enabled=false

# -------------------------
# Telegram Login
# -------------------------
app.telegram.bot-username=${TELEGRAM_BOT_USERNAME:}
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram.auth-max-age-seconds=86400

# -------------------------
# Mail Configuration
# -------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.protocol=smtp
spring.mail.username=${GMAIL_EMAIL:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
app.mail.from=${GMAIL_EMAIL:}

# -------------------------
# Password Reset Flow
# -------------------------
app.url.resetPassword=${APP_URL_RESET_PASSWORD:http://localhost:8080/auth/reset-password?token=}
app.resetToken.expirationMinutes=30
app.verificationToken.expirationMinutes=1440

# -------------------------
# Error Handling
# -------------------------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
